[package]
name = "ms-audio-dock-remapper"
version = "1.0.2"
edition = "2021"
description = "Remap the buttons of the Microsoft Audio Dock on macOS (Rust + Slint)"
license = "MIT"
authors = ["Hung Ngo", "Masterain"]
repository = "https://github.com/hungnv26/ms-audio-dock-remapper-macos"

[dependencies]
slint = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_UI_Input",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics",
  "Win32_System_Diagnostics_Debug",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# IOKit HID access in shared (non-seizing) mode so macOS keeps handling the
# Dock's own volume / media keys while we only read the Teams report.
hidapi = { version = "2", default-features = false, features = ["macos-shared-device"] }
tray-icon = "0.24"
plist = "1"
icns = "0.3"
png = "0.18"
libc = "0.2"
# Re-posting system media keys (exclusive mode) and the Accessibility check.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "NSApplication", "NSResponder", "NSRunningApplication", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
core-foundation = "0.10"

[build-dependencies]
winres = "0.1"
